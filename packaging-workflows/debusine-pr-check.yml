# SEE README.debusine.md BEFORE CHANGING THIS FILE

name: Debusine PR Check

on:
  # workflow_run is required here: the Debusine PR Hook runs in the untrusted
  # pull_request context (no secrets on forks), so the privileged CI work and
  # commit-status updates must run from this separate, trusted workflow. The
  # head SHA is read from the trusted workflow_run payload rather than from
  # attacker-controlled PR data, and no job here is granted write access to
  # repository contents (see the permissions blocks below), so this cannot be
  # abused to push to the repo.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["Debusine PR Hook"]
    types:
      - completed

# Deny all permissions at the workflow level; each job grants only what it
# needs (see the per-job permissions blocks below).
permissions: {}

jobs:
  debusine:
    name: Debusine
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    # This always calls debusine.yml with release: false, so the release job
    # (the only one needing contents: write / deployments: write) is skipped.
    # The jobs that do run only read the repo and pull container images.
    permissions:
      contents: read
      packages: read
    uses: qualcomm-linux/debusine-action/.github/workflows/debusine.yml@main
    with:
      source_ref: refs/pull/${{ github.event.workflow_run.pull_requests[0].number }}/merge
      target_branch: ${{ github.event.workflow_run.pull_requests[0].base.ref }}
      release: false
      debusine-action-ref: main
      debusine-parent-workspace: ${{ vars.DEBUSINE_PARENT_WORKSPACE || 'qli-ci' }}
    secrets:
      DEBUSINE_USER: ${{ secrets.DEBUSINE_USER }}
      DEBUSINE_TOKEN: ${{ secrets.DEBUSINE_TOKEN }}
      DEBUSINE_RELEASE_TOKEN: ${{ secrets.DEBUSINE_RELEASE_TOKEN }}

  set-final-status:
    name: Set Debusine CI Result
    runs-on: ubuntu-latest
    needs: debusine
    if: always()
    # Only needs to report the Debusine CI result as a commit status.
    permissions:
      statuses: write
    steps:
      - name: Set success status
        if: needs.debusine.result == 'success'
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.workflow_run.head_sha,
              state: 'success',
              context: 'Debusine CI',
              description: 'Debusine CI passed'
            });

      - name: Set failure status
        if: needs.debusine.result != 'success'
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.workflow_run.head_sha,
              state: 'failure',
              context: 'Debusine CI',
              description: 'Debusine CI failed'
            });
